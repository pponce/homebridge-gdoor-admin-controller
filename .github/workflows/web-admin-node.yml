name: Web admin Node foundation
on:
  push:
    branches: [web-admin-node-port]
    paths: ['src/web-admin-*.js', 'src/private-store.js', 'test/web-admin*.test.js', 'web-admin/public/**', 'docs/web-admin-assets.json', 'package.json', 'scripts/check-package.mjs', '.github/workflows/web-admin-node.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test test/web-admin*.test.js
      - name: Verify development package assets
        run: |
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/admin-pack.json"
          node scripts/check-package.mjs "$RUNNER_TEMP/admin-pack.json"
