name: Coordinator checks
on:
  push:
    branches: [main]
    paths: ['src/**', 'test/**', 'examples/**', 'package.json', 'config.schema.json', '.github/workflows/ci.yml']
  pull_request:
    paths: ['src/**', 'test/**', 'examples/**', 'package.json', 'config.schema.json', '.github/workflows/ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coordinator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm pack --dry-run --ignore-scripts
