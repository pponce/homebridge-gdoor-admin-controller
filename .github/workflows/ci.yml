name: Coordinator checks
on:
  push:
    branches: [main, config-ui-save-preview]
    paths: ['src/**', 'homebridge-ui/**', 'test/**', 'scripts/**', 'examples/**', 'package.json', 'config.schema.json', '.github/workflows/ci.yml']
  pull_request:
    paths: ['src/**', 'homebridge-ui/**', 'test/**', 'scripts/**', 'examples/**', 'package.json', 'config.schema.json', '.github/workflows/ci.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coordinator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install runtime dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Unit and device protocol checks
        id: tests
        run: node scripts/test-ci.mjs
      - name: "Unit result: ${{ steps.tests.outputs.result || steps.tests.outcome }}"
        if: always()
        run: echo "Unit diagnostics are recorded in this step name."
      - run: npm pack --dry-run --ignore-scripts
  homebridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        homebridge: ['2.0.0', '2.4.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Homebridge for isolated smoke test
        run: npm install --prefix "$RUNNER_TEMP/coordinator-hb" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund homebridge@${{ matrix.homebridge }}
      - name: Actual Homebridge child bridge with synthetic hardware
        id: smoke
        env:
          HOMEBRIDGE_BIN: ${{ runner.temp }}/coordinator-hb/node_modules/homebridge/bin/homebridge.js
        run: node scripts/homebridge-smoke.mjs
      - name: "Homebridge result: ${{ steps.smoke.outputs.result || steps.smoke.outcome }}"
        if: always()
        run: echo "Homebridge diagnostics are recorded in this step name."

  config-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Actual custom UI server IPC and management integration
        run: node scripts/config-ui-server-smoke.mjs
      - name: Install browser tool
        run: npm install --prefix "$RUNNER_TEMP/coordinator-browser" --no-save --package-lock=false --ignore-scripts playwright@1.58.2
      - name: Guided configuration on desktop and mobile
        id: browser
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/coordinator-browser/node_modules/playwright
          PREVIEW_OUTPUT: ${{ runner.temp }}/coordinator-browser/screenshots
        run: node scripts/config-ui-browser.mjs
      - name: Original web admin pages and production save flows
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/coordinator-browser/node_modules/playwright
        run: |
          node scripts/web-admin-browser.mjs
          node scripts/web-admin-write-browser.mjs
      - name: Automatic web setup and live controller timing editor
        id: websettings
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/coordinator-browser/node_modules/playwright
          PREVIEW_OUTPUT: ${{ runner.temp }}/coordinator-browser/screenshots
        run: node scripts/web-admin-settings-browser.mjs
      - name: "Web settings result: ${{ steps.websettings.outputs.result || steps.websettings.outcome }}"
        if: always()
        run: echo "Web settings diagnostics are recorded in this step name."
      - name: "Configuration UI result: ${{ steps.browser.outputs.result || steps.browser.outcome }}"
        if: always()
        run: echo "Configuration UI diagnostics are recorded in this step name."
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: configuration-ui-screenshots
          path: ${{ runner.temp }}/coordinator-browser/screenshots
